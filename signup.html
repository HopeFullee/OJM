<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJM | 회원가입</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./js/pages/sign-up.js"></script>
  </head>
  <body>
    <main class="container mx-auto max-w-600">
      <form class="flex flex-col flex-wrap user-form justify-content-around">
        <div class="row">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            value=""
            placeholder="메인에서 불러드릴 이름"
          />
          <spna class="nickname-message"></spna>
        </div>

        <div class="row">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" value="" placeholder="you@example.com" />
          <spna class="email-message"></spna>
        </div>

        <div class="row">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            name="password"
            value=""
            placeholder="비밀번호를 입력하세요"
          />
          <spna class="pwd-message"></spna>
        </div>

        <div class="row">
          <label for="passwordCheck">비밀번호 확인</label>
          <input
            type="password"
            id="passwordCheck"
            name="passwordCheck"
            vlaue=""
            placeholder="비밀번호 확인"
          />
          <spna class="pwd-check-message"></spna>
        </div>

        <hr />

        <div class="row">
          <input type="checkbox" id="ToS-check" />
          <label for="ToS-check"
            ><strong>[필수]</strong>이용약관 및 개인정보 처리에 동의합니다.</label
          >
          <button type="button" class="ToS-toggle">이용약관 펼치기</button>
        </div>
        <div class="invisible ToS-container">OJM 이용약관 및 개인정보 처리 안내</div>
        <button type="submit" class="btn-insert">약관에 동의하면 가입할 수 있어요.</button>
      </form>
    </main>
  </body>
</html>

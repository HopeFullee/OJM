<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJM | 로그인</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./js/pages/sign-in.js"></script>
  </head>
  <body class="bg-canvas">
    <main>
      <header class="mt-100 mx-auto max-w-600">
        <div class="logo-container">
          <svg class="logo mx-auto">
            <use href="./assets/icons/icon-sign-in-logo.svg"></use>
          </svg>
        </div>
      </header>
      <div class="form-container bg-surface mt-20 mx-auto p-32 max-w-420 border-1 border-line rounded-3xl">
        <form class="signin-form flex flex-col flex-wrap gap-20">
          <div>
            <span class="font-bold text-26">로그인</span>
          </div>

          <div class="flex flex-col flex-wrap justify-between gap-6">
            <label for="email" class="text-14 font-medium">이메일</label>
            <input class="pl-14 h-48 border-1 rounded-xl border-zinc-400"
            type="email" id="email" name="email" value="" placeholder="you@example.com" />
            <spna class="email-message"></spna>
          </div>

          <div class="flex flex-col flex-wrap justify-between gap-6">
            <label for="password" class="text-14 font-medium">비밀번호</label>
            <input class="pl-14 h-48 border-1 rounded-xl border-zinc-400"
              type="password"
              id="password"
              name="password"
              value=""
              placeholder="비밀번호를 입력하세요"
            />
            <spna class="pwd-message"></spna>
          </div>

          <div class="flex flex-col flex-wrap justify-between gap-8">
            <button type="submit" class="btn-signin h-52 pl-24 pr-24 text-white  bg-brand rounded-xl">로그인</button>
          </div>
          <div class="flex flex-row justify-between text-xs text-zinc-400 gap-12">
            <span class="flex-2">
              <svg width="100%" height="100%" viewBox="0 0 126 1" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="126" height="1" fill="#EADFD3"/>
              </svg>
            </span>
            <span class="flex-1/12 text-center">처음이신가요?</span>
            <span class="flex-2">
              <svg width="100%" height="100%" viewBox="0 0 126 1" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="126" height="1" fill="#EADFD3"/>
              </svg>
            </span>
          </div>
          <div class="flex flex-col flex-wrap justify-between gap-8">
            <button type="button" class="btn-signup h-52 pl-24 pr-24 text-brand  border-1 border-brand rounded-xl ">회원가입</button>
          </div>
        </form>
      </div>
    </main>

  </body>
</html>

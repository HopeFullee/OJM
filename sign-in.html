<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJM | 로그인</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./lib/pages/sign-in.js"></script>
  </head>
  <body class="bg-canvas">
    <header class="bg-surface border-line sticky top-0 w-full border-b">
      <div
        class="flex-center md:flex-between max-w-content-sm md:max-w-content-lg relative mx-auto h-56 w-full px-20 md:h-72 md:px-24"
      >
        <h1 class="flex items-start">
          <a href="/" class="space-x-4 md:block">
            <span class="text-30 font-display text-accent leading-none">OJM</span>
            <span class="text-13 text-ink-muted leading-[160%] font-medium"
              >오늘 점심은 무엇입니까</span
            >
          </a>
        </h1>
      </div>
    </header>

    <main class="my-20">
      <selection class="mx-auto max-w-600">
        <div class="logo-container flex min-h-400 flex-col justify-center md:min-h-150">
          <svg class="logo mx-auto" aria-label="메인 페이지로 이동">
            <a href="./index.html"><use href="./assets/icons/icon-sign-in-logo.svg"></use></a>
          </svg>
        </div>
      </selection>
      <div
        class="form-container bg-surface border-line mx-auto mt-20 max-w-420 rounded-3xl border-1 p-32"
      >
        <form class="signin-form flex flex-col flex-wrap gap-20">
          <div>
            <span class="text-26 font-bold">로그인</span>
          </div>

          <div class="flex flex-col flex-wrap justify-between gap-6">
            <label for="email" class="text-14 font-medium">이메일</label>
            <input
              class="h-48 rounded-xl border-1 border-zinc-400 pl-14"
              type="email"
              id="email"
              name="email"
              value=""
              placeholder="you@example.com"
            />
            <spna class="email-message text-14"></spna>
          </div>

          <div class="flex flex-col flex-wrap justify-between gap-6">
            <label for="password" class="text-14 font-medium">비밀번호</label>
            <input
              class="h-48 rounded-xl border-1 border-zinc-400 pl-14"
              type="password"
              id="password"
              name="password"
              value=""
              placeholder="비밀번호를 입력하세요"
            />
            <spna class="pwd-message text-14"></spna>
          </div>

          <div class="flex flex-col flex-wrap justify-between gap-8">
            <button
              type="submit"
              class="btn-signin bg-brand h-52 rounded-xl pr-24 pl-24 text-white"
            >
              로그인
            </button>
          </div>
          <div class="flex flex-row justify-between gap-12 text-xs text-zinc-400">
            <span class="flex-2">
              <svg
                width="100%"
                height="100%"
                viewBox="0 0 126 1"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect width="126" height="1" fill="#EADFD3" />
              </svg>
            </span>
            <span class="flex-1/12 text-center">처음이신가요?</span>
            <span class="flex-2">
              <svg
                width="100%"
                height="100%"
                viewBox="0 0 126 1"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect width="126" height="1" fill="#EADFD3" />
              </svg>
            </span>
          </div>
          <div class="flex flex-col flex-wrap justify-between gap-8">
            <button
              type="button"
              class="btn-signup text-brand border-brand h-52 rounded-xl border-1 pr-24 pl-24"
            >
              회원가입
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>

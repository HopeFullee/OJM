<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJM | My Page</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./js/pages/my-page.js"></script>
  </head>
  <body>
    <header class="bg-surface border-line relative w-full border-b">
      <div
        class="flex-center md:flex-between max-w-content-sm md:max-w-content-lg mx-auto h-56 w-full px-20 md:h-72 md:px-24"
      >
        <button class="flex-center absolute left-8 size-44 md:hidden" aria-label="홈으로 가기 버튼">
          <svg width="22" height="22" class="block">
            <use href="./assets/icons/icon-chevron-left.svg"></use>
          </svg>
        </button>

        <h1 class="flex items-end gap-10">
          <a href="/" class="hidden md:block">
            <span class="text-30 font-display text-accent leading-none">OJM</span>
            <span class="text-13 text-ink-muted leading-[160%] font-medium"
              >오늘 점심은 무엇입니까</span
            >
          </a>
          <strong class="text-15 block md:hidden">마이페이지</strong>
        </h1>

        <div class="md:flex-center hidden gap-8">
          <strong class="text-14">점심탐험가님</strong>
          <nav aria-label="메인 네비게이션바">
            <a
              href="./my-page.html"
              class="text-14 flex-center hover:bg-accent border-full h-44 w-95 font-bold transition-colors hover:text-white"
            >
              마이페이지
            </a>
          </nav>
        </div>
      </div>
    </header>

    <main class="max-w-content-sm md:max-w-content-lg mx-auto px-20 md:px-24">
      <section class="md:flex-between mt-40 hidden">
        <div class="space-y-2">
          <h2 class="text-26 leading-[130%] font-bold tracking-[-0.01em]">마이페이지</h2>
          <p class="text-14 text-ink-muted font-medium">점심탐험가 · you@example.com</p>
        </div>
        <button class="flex-center bg-ink h-44 w-180 gap-2 rounded-[12px] text-white">
          <svg width="20" height="20" viewBox="0 0 22 22">
            <use href="./assets/icons/icon-chevron-left.svg"></use>
          </svg>
          <span class="text-14"> 오늘 메뉴 고르러 가기 </span>
        </button>
      </section>

      <section></section>
    </main>
  </body>
</html>
